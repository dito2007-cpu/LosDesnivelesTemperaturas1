<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Los Desniveles · Temperaturas</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6f8;color:#17202a}
header{background:#1565c0;color:white;padding:18px 16px;font-size:20px;font-weight:700;position:sticky;top:0;z-index:5}
main{max-width:760px;margin:auto;padding:16px;padding-bottom:90px}.card{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #00000010}
h2{margin:4px 0 10px}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:13px 15px;cursor:pointer}
.primary{background:#1565c0;color:white}.secondary{background:#e9eef5;color:#17324d}.danger{background:#c62828;color:white}.full{width:100%;margin:6px 0}
label{display:block;font-weight:600;margin:10px 0 5px}input,select{width:100%;padding:12px;border:1px solid #ccd3da;border-radius:10px;background:white}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.equip{padding:13px;border-radius:12px;background:#f0f4f8;border:2px solid transparent;text-align:left}.equip.selected{border-color:#1565c0;background:#e7f0fb}
.status{padding:10px;border-radius:10px;margin:8px 0;font-weight:700}.ok{background:#dff3e5;color:#146b32}.bad{background:#ffe0e0;color:#9b1c1c}.warn{background:#fff0c9;color:#765300}
.small{font-size:13px;color:#5d6873}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.right{display:flex;justify-content:space-between;align-items:center}.hidden{display:none}.signature{height:160px;border:1px dashed #8b98a5;border-radius:10px;background:white;touch-action:none;width:100%}
.table{overflow:auto}.record{border-left:5px solid #2e7d32;padding:10px;background:#f7faf8;border-radius:8px;margin:7px 0}.record.badrecord{border-left-color:#c62828;background:#fff7f7}
.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;padding:8px;display:flex;gap:6px;z-index:10}.nav button{flex:1;padding:10px 4px;background:#eef2f6}.nav button.active{background:#dbeafe;color:#0d47a1;font-weight:700}
</style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">

</head>
<body>
<header>Los Desniveles · Control de temperaturas</header>
<main id="app"></main>
<nav class="nav">
<button data-page="home">Inicio</button><button data-page="registro">🌡 Registrar</button><button data-page="historial">📋 Historial</button><button data-page="config">⚙ Equipos</button>
</nav>
<script>
const DEFAULT=[
["Frigorífico 1",false,8],["Frigorífico 2",false,8],["Congelador 3",true,-18],["Congelador 4",true,-18],
["Frigorífico 5",false,8],["Congelador 6",true,-18],["Botellero 7",false,8],["Botellero 8",false,8],
["Nevera expositora 9",false,8],["Botellero 10",false,8],["Congelador helados 11",true,-18]
];
let equipos=JSON.parse(localStorage.getItem("ld_equipos")||"null")||DEFAULT.map(x=>({nombre:x[0],congelador:x[1],limite:x[2]}));
let registros=JSON.parse(localStorage.getItem("ld_registros")||"[]");
let responsable=localStorage.getItem("ld_responsable")||"";
let page="home", selected=0, signature=null;

function save(){localStorage.setItem("ld_equipos",JSON.stringify(equipos));localStorage.setItem("ld_registros",JSON.stringify(registros));localStorage.setItem("ld_responsable",responsable)}
function today(){return new Date().toISOString().slice(0,10)}
function dateTime(){return new Date().toLocaleString("es-ES",{dateStyle:"short",timeStyle:"short"})}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function already(name){return registros.some(r=>r.equipo===name&&r.dia===today())}
function setPage(p){page=p;render()}
function render(){
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
 const a=document.getElementById("app");
 if(page==="home") a.innerHTML=home();
 if(page==="registro") a.innerHTML=registro();
 if(page==="historial") a.innerHTML=historial();
 if(page==="config") a.innerHTML=config();
 if(page==="calendario") a.innerHTML=calendario();
 bind();
}
function home(){
 const count=registros.filter(r=>r.dia===today()).length;
 return `<div class="card"><h2>Control diario</h2><p>Una medición al día por cada equipo.</p>
 <div class="status ${count===equipos.length?"ok":count?"warn":"bad"}">${count===equipos.length?"🟢 Registro diario completo":"📅 Hoy: "+count+"/"+equipos.length+" equipos registrados"}</div>
 <button class="primary full" onclick="setPage('registro')">🌡 Registrar temperaturas</button>
 <button class="secondary full" onclick="setPage('calendario')">📅 Calendario mensual</button>
 <button class="secondary full" onclick="exportCSV()">📊 Exportar CSV</button>
 <button class="secondary full" onclick="exportPDF()">📄 Generar informe PDF</button></div>
 <div class="card"><b>Datos guardados automáticamente</b><p class="small">Los registros se almacenan en este navegador mediante almacenamiento local. Cerrar la web o salir de ella no los borra.</p></div>`;
}
function registro(){
 const e=equipos[selected]||equipos[0], ya=already(e.nombre);
 return `<div class="card"><h2>Registro de hoy</h2><p class="small">${new Date().toLocaleDateString("es-ES",{dateStyle:"full"})}</p>
 <label>Responsable</label><input id="responsable" value="${esc(responsable)}" placeholder="Nombre del responsable">
 <label>Equipo</label><div class="grid">${equipos.map((x,i)=>`<button class="equip ${i===selected?"selected":""}" data-e="${i}">${esc(x.nombre)}<br><span class="small">Límite: ${x.limite} °C</span></button>`).join("")}</div>
 <label>Temperatura °C</label><input id="temp" type="number" step="0.1" inputmode="decimal" placeholder="Ej. 4.5">
 <div id="tempStatus"></div>
 <div id="incidencia" class="hidden"><label>Acción correctiva realizada</label><input id="accion" placeholder="Ej. Revisar equipo / avisar responsable"></div>
 <label>Firma del responsable</label><canvas id="sig" class="signature"></canvas>
 <div class="row"><button class="secondary" id="clearSig">Borrar firma</button><button class="primary" id="saveReg" ${ya?"disabled":""}>${ya?"Ya registrado hoy":"Guardar medición"}</button></div>
 <p id="msg"></p><button class="secondary full" onclick="setPage('home')">Volver</button></div>`;
}
function updateStatus(){
 const t=parseFloat(document.getElementById("temp")?.value),e=equipos[selected],box=document.getElementById("tempStatus"),inc=document.getElementById("incidencia");
 if(!box)return;
 if(Number.isNaN(t)){box.innerHTML="";inc.classList.add("hidden");return}
 const bad=t>e.limite;
 box.innerHTML=`<div class="status ${bad?"bad":"ok"}">${bad?"🔴 FUERA DE RANGO":"🟢 Dentro de rango"} · límite ${e.limite} °C</div>`;
 inc.classList.toggle("hidden",!bad);
}
function historial(){
 const years=[...new Set(registros.map(r=>r.dia?.slice(0,4)).filter(Boolean))].sort((a,b)=>b.localeCompare(a));
 const months=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
 const selectedYear=window.histYear??"todos", selectedMonth=window.histMonth??"todos";
 let filtered=[...registros].filter(r=>{
   const y=r.dia?.slice(0,4), m=r.dia?.slice(5,7);
   return (selectedYear==="todos"||y===selectedYear)&&(selectedMonth==="todos"||m===selectedMonth);
 }).sort((a,b)=>b.timestamp-a.timestamp);
 const label=(r)=>{
   const d=new Date(r.dia+"T12:00:00");
   return d.toLocaleDateString("es-ES",{day:"2-digit",month:"long",year:"numeric"});
 };
 const groups={};
 filtered.forEach(r=>{
   const key=r.dia?.slice(0,7)||"Sin fecha";
   (groups[key]??=[]).push(r);
 });
 let body="";
 Object.keys(groups).sort((a,b)=>b.localeCompare(a)).forEach(key=>{
   const [y,m]=key.split("-");
   const title=key==="Sin fecha"?"Sin fecha":`${months[Number(m)-1]} ${y}`;
   body+=`<h3 style="margin:18px 0 8px">${title} <span class="small">(${groups[key].length})</span></h3>`;
   body+=groups[key].map(r=>`<div class="record ${r.incidencia?"badrecord":""}">
     <b>${esc(r.equipo)}</b><br>${r.temp} °C · ${esc(label(r))}<br>
     Responsable: ${esc(r.responsable)}<br>
     ${r.incidencia?"🔴 Incidencia: "+esc(r.accion):"🟢 Dentro de rango"}<br>
     Firma: ${esc(r.firma||"Firma digital")}
   </div>`).join("");
 });
 return `<div class="card"><h2>Historial</h2>
 <p>${filtered.length} de ${registros.length} registros mostrados</p>
 <div class="row">
   <div><label>Año</label><select id="historyYear">
     <option value="todos" ${selectedYear==="todos"?"selected":""}>Todos los años</option>
     ${years.map(y=>`<option value="${y}" ${selectedYear===y?"selected":""}>${y}</option>`).join("")}
   </select></div>
   <div><label>Mes</label><select id="historyMonth">
     <option value="todos" ${selectedMonth==="todos"?"selected":""}>Todos los meses</option>
     ${months.map((name,i)=>{const v=String(i+1).padStart(2,"0");return `<option value="${v}" ${selectedMonth===v?"selected":""}>${name}</option>`}).join("")}
   </select></div>
 </div>
 <button class="secondary full" onclick="window.histYear='todos';window.histMonth='todos';render()">📚 Ver todos los registros</button>
 <button class="secondary full" onclick="exportCSV()">📊 Exportar CSV</button>
 <button class="secondary full" onclick="exportPDF()">📄 Informe PDF</button>
 ${body||"<p>No hay registros para el periodo seleccionado.</p>"}
 </div>`;
}
function config(){
 return `<div class="card"><h2>Configuración</h2><p class="small">Cambia los límites o añade equipos. Los cambios se guardan automáticamente.</p>
 ${equipos.map((e,i)=>`<div class="card" style="background:#f7f9fb"><div class="right"><b>${esc(e.nombre)}</b><button class="danger" data-del="${i}">Eliminar</button></div>
 <label>Límite máximo °C</label><input class="limit" data-i="${i}" type="number" step="0.1" value="${e.limite}">
 <label><input style="width:auto" type="checkbox" data-cong="${i}" ${e.congelador?"checked":""}> Es congelador</label></div>`).join("")}
 <h3>Añadir equipo</h3><label>Nombre</label><input id="newName" placeholder="Ej. Cámara nueva">
 <label>Límite máximo °C</label><input id="newLimit" type="number" step="0.1" placeholder="Ej. 8">
 <label><input style="width:auto" id="newCong" type="checkbox"> Es congelador</label>
 <button class="primary full" id="addEquip">➕ Añadir equipo</button>
 <button class="secondary full" onclick="setPage('home')">Volver</button></div>`;
}
function calendario(){
 const now=new Date(), y=now.getFullYear(),m=now.getMonth(), days=new Date(y,m+1,0).getDate();
 let out=`<div class="card"><h2>Calendario mensual</h2><p>${now.toLocaleDateString("es-ES",{month:"long",year:"numeric"})}</p>`;
 for(let d=1;d<=days;d++){let key=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`,n=registros.filter(r=>r.dia===key).length;out+=`<div class="status ${n===equipos.length?"ok":n?"warn":"bad"}">${String(d).padStart(2,"0")}/${String(m+1).padStart(2,"0")} — ${n===equipos.length?"🟢 Completo":n?"🟡 "+n+"/"+equipos.length:"🔴 Sin registros"}</div>`}
 return out+`<button class="secondary full" onclick="setPage('home')">Volver</button></div>`;
}
function bind(){
 document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>setPage(b.dataset.page));
 const hy=document.getElementById("historyYear"), hm=document.getElementById("historyMonth");
 if(hy)hy.onchange=()=>{window.histYear=hy.value;render()};
 if(hm)hm.onchange=()=>{window.histMonth=hm.value;render()};
 document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{selected=+b.dataset.e;render()});
 const t=document.getElementById("temp");if(t)t.oninput=updateStatus;
 const r=document.getElementById("responsable");if(r)r.oninput=()=>{responsable=r.value;save()};
 const sig=document.getElementById("sig");if(sig){let ctx=sig.getContext("2d"),down=false,last;
  sig.width=sig.clientWidth*devicePixelRatio;sig.height=sig.clientHeight*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineWidth=3;ctx.lineCap="round";
  sig.onpointerdown=e=>{down=true;last=[e.offsetX,e.offsetY]};sig.onpointermove=e=>{if(!down)return;ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();last=[e.offsetX,e.offsetY]};sig.onpointerup=()=>{down=false;signature=sig.toDataURL()};sig.onpointerleave=()=>down=false;
  document.getElementById("clearSig").onclick=()=>{ctx.clearRect(0,0,sig.width,sig.height);signature=null};
 }
 const saveBtn=document.getElementById("saveReg");if(saveBtn)saveBtn.onclick=saveRegistro;
 document.querySelectorAll(".limit").forEach(x=>x.onchange=()=>{equipos[+x.dataset.i].limite=parseFloat(x.value)||0;save();render()});
 document.querySelectorAll("[data-cong]").forEach(x=>x.onchange=()=>{equipos[+x.dataset.cong].congelador=x.checked;save()});
 document.querySelectorAll("[data-del]").forEach(x=>x.onclick=()=>{if(confirm("¿Eliminar este equipo?")){equipos.splice(+x.dataset.del,1);save();render()}});
 const add=document.getElementById("addEquip");if(add)add.onclick=()=>{let n=document.getElementById("newName").value.trim(),l=parseFloat(document.getElementById("newLimit").value),c=document.getElementById("newCong").checked;if(!n||Number.isNaN(l)){alert("Indica nombre y límite.");return}equipos.push({nombre:n,limite:l,congelador:c});save();render()};
}
function saveRegistro(){
 const e=equipos[selected],t=parseFloat(document.getElementById("temp").value);
 if(!responsable.trim()||Number.isNaN(t)||!signature){alert("Completa responsable, temperatura y firma.");return}
 if(already(e.nombre)){alert("Este equipo ya está registrado hoy.");return}
 const bad=t>e.limite,accion=bad?(document.getElementById("accion")?.value||""):"";
 if(bad&&!accion){alert("Indica la acción correctiva.");return}
 registros.unshift({equipo:e.nombre,temp:t,fecha:dateTime(),dia:today(),timestamp:Date.now(),responsable,incidencia:bad,accion,firma:"Firma digital"});
 save();alert("✓ Registro guardado automáticamente.");render();
}
function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportCSV(){let rows=[["Equipo","Temperatura °C","Fecha","Responsable","Incidencia","Acción correctiva"],...registros.map(r=>[r.equipo,r.temp,r.fecha,r.responsable,r.incidencia?"Sí":"No",r.accion])];download(new Blob(["\ufeff"+rows.map(x=>x.map(v=>`"${String(v).replaceAll('"','""')}"`).join(";")).join("\n")],{type:"text/csv;charset=utf-8"}),"LosDesniveles_temperaturas.csv")}
function exportPDF(){window.print()}
window.addEventListener("beforeunload",save);render();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(err => console.warn("PWA:", err));
  });
}
</script>

</body></html>
